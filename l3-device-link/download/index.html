 
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#078b50">
  <title>L3 Device Link — Download</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f4f8f5;
      color: #17251d;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    main {
      max-width: 650px;
      width: 100%;
      background: white;
      padding: 40px;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 8px 35px #163c2515;
    }
    .logo {
      width: 90px;
      height: 90px;
      margin: auto;
      border-radius: 22px;
      background: #078b50;
      color: white;
      display: grid;
      place-items: center;
      font-size: 32px;
      font-weight: bold;
      border: 6px solid #fbbc04;
    }
    h1 { margin-bottom: 8px; }
    .intro { color: #607067; line-height: 1.6; }
    .download {
      display: inline-block;
      margin-top: 20px;
      padding: 15px 25px;
      background: #078b50;
      color: white;
      border-radius: 12px;
      text-decoration: none;
      font-weight: bold;
    }
    .download:hover { background: #056d3e; }
    .note {
      margin-top: 28px;
      padding: 16px;
      background: #fff8df;
      border-radius: 12px;
      color: #62521e;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main>
    <div class="logo">L3</div>
    <h1>L3 Device Link</h1>
    <p class="intro">
      Connect your devices in one simple workspace.
      Pair devices and manage your connections from one place.
    </p>
    <h2>Get L3 Device Link</h2>
    <p>The dedicated app is being built.</p>
    <div class="note">
      We're working on the Chromebook app first,
      followed by Android, iPhone, Windows, Mac and Linux.
    </div>
  </main>
</body>
</html>
